name: hudas_3d_buddy
description: A comprehensive 3D printing cost calculator app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  
  # Routing
  go_router: ^17.1.0
  
  # Local Storage
  shared_preferences: ^2.2.3
  
  # Forms & Validation
  flutter_form_builder: ^10.3.0+1
  form_builder_validators: ^11.2.0
  
  # UI Components
  flutter_slidable: ^4.0.3
  smooth_page_indicator: ^2.0.1
  google_fonts: ^8.0.0
  flutter_animate: ^4.5.0
  
  # Utilities
  uuid: ^4.3.3
  intl: ^0.20.0
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

